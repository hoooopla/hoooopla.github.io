name: Build published notes
on:
  push:
    branches: [main]
    paths:
      - 'notes-workspace/**'
      - 'scripts/build-notes.mjs'
      - 'vendor/math-note-editor'
      - '.gitmodules'
      - 'notes.css'
      - 'notes.js'
      - 'package*.json'
      - '.github/workflows/build-notes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:notes
      - name: Commit rendered notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/
          if ! git diff --cached --quiet; then
            git commit -m "Build published notes"
            git push
          fi
